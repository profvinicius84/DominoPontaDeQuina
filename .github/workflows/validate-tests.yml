name: Validate Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DominoPontaDeQuina.Tests/DominoPontaDeQuina.Tests.csproj

      - name: Build
        run: dotnet build DominoPontaDeQuina.Tests/DominoPontaDeQuina.Tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test DominoPontaDeQuina.Tests/DominoPontaDeQuina.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      - name: Build migrations and local webhook relay
        run: |
          dotnet build DominoPontaDeQuina.Migrations/DominoPontaDeQuina.Migrations.csproj --configuration Release
          dotnet build DominoPontaDeQuina.WebhookRelay/DominoPontaDeQuina.WebhookRelay.csproj --configuration Release

      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn
